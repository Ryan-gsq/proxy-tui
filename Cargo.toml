[package]
name = "proxy-tui"
version = "0.1.0"
edition = "2021"
description = "High-throughput HTTP/HTTPS/SOCKS5 mixed-port proxy with per-interface egress and a TUI"
license = "MIT"
repository = "https://github.com/Ryan-gsq/proxy-tui"

[lib]
name = "proxy_tui"
path = "src/lib.rs"

[[bin]]
name = "proxy-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
httparse = "1"
libc = "0.2"
nix = { version = "0.29", features = ["net", "hostname", "user"] }
rand = "0.8"
ratatui = "0.29"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
